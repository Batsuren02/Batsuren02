<svg xmlns="http://www.w3.org/2000/svg" width="880" height="76" viewBox="0 0 880 76" fill="none" role="img" aria-label="CONTACT">
  <defs>
    <linearGradient id="bgContact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12203A"/>
      <stop offset="45%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="ruleContact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="55%" stop-color="#1F6FEB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txtContact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7FBBFF"/>
    </linearGradient>
    <linearGradient id="swContact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowContact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipContact"><rect x="0" y="0" width="880" height="76" rx="12"/></clipPath>
    <style>
      .mContact { font-family: "SFMono-Regular","JetBrains Mono",Consolas,"Liberation Mono",monospace; }
      @keyframes sweepContact { 0% { transform: translateX(-260px); } 100% { transform: translateX(880px); } }
      @keyframes blinkContact { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes floatContact { 0%,100% { transform: translateX(0); } 50% { transform: translateX(26px); } }
      .sweepContact { animation: sweepContact 6s ease-in-out infinite; }
      .cursorContact { animation: blinkContact 1.1s steps(1) infinite; }
      .orbContact { animation: floatContact 12s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="880" height="76" rx="12" fill="url(#bgContact)"/>
  <g clip-path="url(#clipContact)">
    <ellipse class="orbContact" cx="70" cy="38" rx="200" ry="90" fill="url(#glowContact)"/>
    <rect class="sweepContact" x="0" y="0" width="260" height="1.5" fill="url(#swContact)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="75" rx="12" fill="none" stroke="#1F2A3A"/>

  <rect x="26" y="22" width="3" height="32" rx="1.5" fill="#58A6FF"/>

  <text class="mContact" x="44" y="36" font-size="18" font-weight="700" letter-spacing="3.5" fill="url(#txtContact)">// CONTACT</text>
  <rect class="cursorContact" x="191" y="24" width="9" height="15" fill="#58A6FF"/>

  <text class="mContact" x="44" y="56" font-size="11.5" letter-spacing="1.2" fill="#6E7681">one inbox, checked daily</text>

  <text class="mContact" x="854" y="45" font-size="11" letter-spacing="1" fill="#30363D" text-anchor="end">./contact.sh</text>
  <path d="M44 64 H320" stroke="url(#ruleContact)" stroke-width="1.5"/>
</svg>
